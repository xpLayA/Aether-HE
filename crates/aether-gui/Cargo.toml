[package]
name = "aether-gui"
description = "Simple desktop UI for Aether keyboards"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aether-gui"
path = "src/main.rs"

[dependencies]
aether-proto.workspace = true
aether-device.workspace = true
aether-effects.workspace = true
slint = "1.18"
serde_json = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
fastrand = "2"

[build-dependencies]
slint-build = "1.18"
