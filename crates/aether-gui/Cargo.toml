[package]
name = "aether-gui"
description = "Simple desktop UI for Aether keyboards"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aether-gui"
path = "src/main.rs"

[dependencies]
aether-proto.workspace = true
aether-device.workspace = true
aether-effects.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
