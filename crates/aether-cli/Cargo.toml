[package]
name = "aether-cli"
description = "Command-line control for Aether keyboards"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether-proto.workspace = true
aether-device.workspace = true
aether-effects.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
env_logger = "0.11"
anyhow = "1"
